<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jackiebuckets.party</title>
<style>
  :root {
    --status-h: 42px;
    --cyan: #7ffcff;
    --blue: #0000aa;
    --panel: #c0c0c0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #05070b; font-family: "Courier New", monospace; }
  body { overflow-x: hidden; }

  .site {
    min-height: 100vh;
    background: #05070b;
    color: white;
  }

  .viewport {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    background: #05070b;
    scrollbar-width: none;
  }
  .viewport::-webkit-scrollbar { display: none; }

  .scene {
    position: relative;
    width: max(100vw, 1100px);
    aspect-ratio: 1536 / 738;
    overflow: hidden;
    background: #111;
  }

  .scene-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    pointer-events: none;
    transition: filter 700ms ease, transform 700ms ease;
  }

  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.015) 0px,
        rgba(255,255,255,.015) 1px,
        rgba(0,0,0,.02) 2px,
        rgba(0,0,0,.02) 3px
      ),
      radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.16) 100%);
    mix-blend-mode: screen;
    opacity: .38;
  }

  body.dark .scene-image {
    filter: brightness(.42) saturate(.82) contrast(1.14) hue-rotate(165deg);
  }

  body.dark .scene::before {
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(rgba(0,18,52,.28), rgba(0,8,28,.48)),
      radial-gradient(circle at 30% 35%, rgba(20,70,120,.12), transparent 45%);
  }

  .mode-box {
    position: absolute;
    top: 46px;
    right: 14px;
    z-index: 5;
    background: #d8d8d8;
    color: #111;
    border: 2px solid #efefef;
    box-shadow: inset -2px -2px #777, inset 2px 2px #fff;
    min-width: 168px;
    padding: 7px 10px 8px;
    text-align: left;
    line-height: 1.2;
    font-size: 16px;
  }
  .mode-box strong { display:block; font-size: 18px; }

  .hotspot {
    position: absolute;
    z-index: 4;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .hotspot:focus-visible {
    outline: 2px dashed var(--cyan);
    outline-offset: 2px;
  }

  /* Useful during editing:
     body.debug .hotspot { outline: 2px solid red; background: rgba(255,0,0,.08); }
  */

  #lamp     { left: 20.5%; top: 47%; width: 9%;  height: 24%; }
  #computer { left: 33%;   top: 48%; width: 16%; height: 27%; }
  #stereo   { left: 59%;   top: 57%; width: 17%; height: 20%; }
  #photos   { left: 25%;   top: 12%; width: 21%; height: 40%; }
  #tapestry { left: 46%;   top: 7%;  width: 20%; height: 55%; }
  #skull    { left: 67%;   top: 8%;  width: 9%;  height: 34%; }
  #door     { left: 77%;   top: 16%; width: 18%; height: 73%; }
  #guitar   { left: 11%;   top: 48%; width: 11%; height: 38%; }
  #records  { left: 56%;   top: 67%; width: 20%; height: 26%; }

  .status {
    position: sticky;
    bottom: 0;
    z-index: 20;
    min-height: var(--status-h);
    background: #000;
    border-top: 1px solid #555;
    color: #f5f5f5;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
    font-size: 15px;
    letter-spacing: .04em;
  }

  #statusText { min-width: 0; }
  .status-right { color: #aaa; white-space: nowrap; font-size: 12px; }

  .window {
    position: fixed;
    z-index: 50;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, calc(100vw - 28px));
    background: var(--panel);
    color: #000;
    border: 2px solid #fff;
    box-shadow:
      inset -2px -2px #707070,
      inset 2px 2px #dfdfdf,
      8px 8px 0 rgba(0,0,0,.35);
  }
  .window[hidden] { display: none; }

  .window-title {
    background: var(--blue);
    color: white;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 5px 4px 7px;
  }
  .window-title button {
    width: 26px;
    height: 24px;
    border: 2px solid #fff;
    box-shadow: inset -2px -2px #777, inset 2px 2px #eee;
    background: #c0c0c0;
    color: #000;
    font-weight: bold;
    line-height: 16px;
  }

  .window-body {
    padding: 14px;
    font-family: "Courier New", monospace;
  }

  .terminal {
    background: #061015;
    color: var(--cyan);
    border: 3px inset #a0a0a0;
    min-height: 230px;
    padding: 14px;
    line-height: 1.6;
  }
  .terminal button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    color: var(--cyan);
    font: inherit;
    padding: 5px 0;
    cursor: pointer;
  }
  .terminal button:hover,
  .terminal button:focus-visible {
    background: rgba(127,252,255,.1);
    outline: none;
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .win-button {
    min-width: 84px;
    padding: 6px 12px;
    background: #c0c0c0;
    color: #000;
    border: 2px solid #fff;
    box-shadow: inset -2px -2px #777, inset 2px 2px #eee;
    font: inherit;
  }

  @media (max-width: 700px) {
    .scene {
      width: 1080px;
    }
    .mode-box {
      top: 40px;
      right: 10px;
      font-size: 14px;
      min-width: 145px;
    }
    .mode-box strong { font-size: 16px; }
    .status-right { display: none; }
    .status { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene-image { transition: none; }
  }
</style>
</head>
<body class="dark">
<div class="site">

  <div class="viewport" id="viewport" aria-label="Jackiebuckets room. Drag sideways on a phone to look around.">
    <div class="scene" id="scene">
      <img src="room.jpg" class="scene-image" alt="A retro bedroom studio with a CRT computer, records, wall art, pink guitar, hula lamp, and closed door.">

      <div class="mode-box" aria-live="polite">
        <strong id="modeLabel">DARK MODE</strong>
        <span id="clockLabel">--:-- --</span>
      </div>

      <button class="hotspot" id="lamp" aria-label="Hula lamp"></button>
      <button class="hotspot" id="computer" aria-label="Computer"></button>
      <button class="hotspot" id="stereo" aria-label="Stereo and turntable"></button>
      <button class="hotspot" id="photos" aria-label="Wall pictures"></button>
      <button class="hotspot" id="tapestry" aria-label="Orange tapestry"></button>
      <button class="hotspot" id="skull" aria-label="Beaded skull"></button>
      <button class="hotspot" id="door" aria-label="Closed door"></button>
      <button class="hotspot" id="guitar" aria-label="Pink Stratocaster"></button>
      <button class="hotspot" id="records" aria-label="Records and books"></button>
    </div>
  </div>

  <div class="status" aria-live="polite">
    <div id="statusText">CLICK AROUND.</div>
    <div class="status-right">SOME THINGS WORK. SOME THINGS DON'T.</div>
  </div>

  <section class="window" id="computerWindow" hidden aria-modal="true" role="dialog" aria-labelledby="computerTitle">
    <div class="window-title">
      <span id="computerTitle">C:\JACKIEBUCKETS</span>
      <button type="button" data-close aria-label="Close">×</button>
    </div>
    <div class="window-body">
      <div class="terminal">
        JACKIEBUCKETS.PARTY<br>
        -------------------<br><br>
        <button type="button" data-page="internet">&gt; INTERNET</button>
        <button type="button" data-page="photos">&gt; PHOTOS</button>
        <button type="button" data-page="music">&gt; MUSIC</button>
        <button type="button" data-page="journal">&gt; JOURNAL</button>
        <button type="button" data-page="unknown">&gt; ???</button>
      </div>
    </div>
  </section>

  <section class="window" id="contentWindow" hidden aria-modal="true" role="dialog" aria-labelledby="contentTitle">
    <div class="window-title">
      <span id="contentTitle">WINDOW</span>
      <button type="button" data-close aria-label="Close">×</button>
    </div>
    <div class="window-body">
      <div id="contentBody"></div>
      <div class="dialog-actions">
        <button class="win-button" type="button" data-close>OK</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const status = document.getElementById('statusText');
  const viewport = document.getElementById('viewport');
  const computerWindow = document.getElementById('computerWindow');
  const contentWindow = document.getElementById('contentWindow');
  const contentTitle = document.getElementById('contentTitle');
  const contentBody = document.getElementById('contentBody');
  const modeLabel = document.getElementById('modeLabel');
  const clockLabel = document.getElementById('clockLabel');

  const say = (text) => { status.textContent = text; };

  function setMode(mode) {
    document.body.classList.toggle('dark', mode === 'dark');
    modeLabel.textContent = mode === 'dark' ? 'DARK MODE' : 'LIGHT MODE';
    say(mode === 'dark' ? 'LIGHTS OUT.' : 'THAT\'S BETTER.');
  }

  function toggleMode() {
    setMode(document.body.classList.contains('dark') ? 'light' : 'dark');
  }

  function openWindow(el) {
    el.hidden = false;
    const close = el.querySelector('[data-close]');
    if (close) close.focus();
  }

  function closeWindows() {
    computerWindow.hidden = true;
    contentWindow.hidden = true;
    say('CLICK AROUND.');
  }

  function showPage(kind) {
    const pages = {
      internet: ['INTERNET', 'LINKS WILL LIVE HERE.<br><br>THE INTERNET USED TO BE WEIRDER.'],
      photos: ['PHOTOS', 'PHOTO ALBUM COMING SOON.<br><br>YOU REMEMBER THIS DIFFERENTLY.'],
      music: ['MUSIC', 'NOW PLAYING: NOTHING YET.<br><br>THE TURNTABLE STILL WORKS.'],
      journal: ['JOURNAL', 'WORDS GO HERE.<br><br>NOT EVERYTHING NEEDS TO BE POSTED.'],
      unknown: ['???', 'YOU FOUND SOMETHING THAT DOESN\'T EXIST YET.']
    };
    const [title, body] = pages[kind] || ['ERROR', 'NOT FOUND.'];
    contentTitle.textContent = title;
    contentBody.innerHTML = body;
    computerWindow.hidden = true;
    openWindow(contentWindow);
  }

  const hotspots = {
    lamp: {
      hover: 'THE HULA LAMP.',
      click: () => toggleMode()
    },
    computer: {
      hover: 'THE COMPUTER.',
      click: () => { say('BOOTING...'); openWindow(computerWindow); }
    },
    stereo: {
      hover: 'IT STILL WORKS.',
      click: () => showPage('music')
    },
    photos: {
      hover: 'YOU REMEMBER THIS DIFFERENTLY.',
      click: () => showPage('photos')
    },
    tapestry: {
      hover: 'YOU\'VE LOOKED AT THIS A LOT.',
      click: () => say('IT DOESN\'T DO ANYTHING. PROBABLY.')
    },
    skull: {
      hover: 'LITTLE BEADED GUY.',
      click: () => say('HE KNOWS SOMETHING.')
    },
    door: {
      hover: 'A CLOSED DOOR.',
      click: () => say('NOT YET.')
    },
    guitar: {
      hover: 'THE PINK STRAT.',
      click: () => say('DON\'T DROP IT.')
    },
    records: {
      hover: 'RECORDS. BOOKS. HUMAN DESTINY.',
      click: () => say('YOU COULD STAY HERE A WHILE.')
    }
  };

  Object.entries(hotspots).forEach(([id, config]) => {
    const el = document.getElementById(id);
    el.addEventListener('mouseenter', () => say(config.hover));
    el.addEventListener('focus', () => say(config.hover));
    el.addEventListener('mouseleave', () => say('CLICK AROUND.'));
    el.addEventListener('click', config.click);
  });

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', closeWindows);
  });

  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.page));
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeWindows();
  });

  function updateClock() {
    const now = new Date();
    clockLabel.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);

  // On small screens, begin near the center of the room instead of the far-left edge.
  function centerMobile() {
    if (window.innerWidth <= 700) {
      viewport.scrollLeft = Math.max(0, (viewport.scrollWidth - viewport.clientWidth) * 0.42);
    }
  }
  window.addEventListener('load', centerMobile, { once: true });
})();
</script>
</body>
</html>
