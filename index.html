<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jackiebuckets.party</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#eee;font-family:"Courier New",monospace;touch-action:none}
.window{height:100dvh;display:flex;flex-direction:column;background:#05070b}
.titlebar{height:44px;flex:0 0 44px;background:#0700b8;border:4px ridge #ddd;display:flex;align-items:center;padding:0 10px;font-weight:bold;font-size:clamp(18px,4vw,27px);letter-spacing:.5px;z-index:20}
.buttons{margin-left:auto;display:flex;gap:3px}.buttons i{width:34px;height:30px;background:#d8d8d8;border:4px outset #eee;color:#111;display:grid;place-items:center;font-style:normal;font-family:Arial;font-size:18px}
.viewport{position:relative;flex:1;overflow:hidden;background:#060b13;cursor:grab}
.viewport.dragging{cursor:grabbing}
.scene{position:absolute;inset:0;overflow:hidden}
.camera{
 position:absolute;left:50%;top:50%;
 width:1000px;height:593px;
 transform:translate(-50%,-50%);
 transform-origin:50% 50%;
 will-change:left,top,transform;
 transition:left .18s steps(3,end),top .18s steps(3,end),transform .34s steps(6,end)
}
.camera.stepped{transition:none}
.room{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:fill;user-select:none;-webkit-user-drag:none;
 image-rendering:pixelated;transition:opacity .35s ease
}
.room.day{opacity:0}.daytime .room.day{opacity:1}.daytime .room.night{opacity:0}
.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:2px dashed #fff}

#lamp{left:22.8%;top:43.0%;width:8.3%;height:22.5%}
#computer{left:32.8%;top:40.8%;width:18.8%;height:28.0%;z-index:17}
#music{left:59.0%;top:49.5%;width:17.8%;height:21.5%}
#photos{left:24.0%;top:8.5%;width:21.5%;height:34.5%}
#door{left:76.7%;top:10.0%;width:17.5%;height:60.0%}
#guitar{left:11.0%;top:43.5%;width:8.5%;height:31.5%}
#tapestry{left:46.0%;top:6.0%;width:21.0%;height:48.0%}
#skull{left:67.0%;top:7.5%;width:8.5%;height:27.0%}
#records{left:57.0%;top:64.0%;width:20.0%;height:24.0%}
.mode{position:absolute;right:16px;top:16px;background:#d6d6d6;color:#171717;border:5px ridge #eee;padding:8px 14px;z-index:12;min-width:150px;box-shadow:2px 2px #111;font-size:15px;pointer-events:none}
.mode b{display:block;font-size:20px}.mode span{display:block;margin-top:4px}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:12;background:rgba(5,5,5,.75);border:2px solid #777;padding:8px 13px;white-space:nowrap;font-size:13px;pointer-events:none;transition:opacity .3s}
.status{height:54px;flex:0 0 54px;background:#020202;border-top:2px solid #555;padding:15px 22px;font-size:16px;letter-spacing:2px;z-index:20}
.back{position:absolute;left:14px;top:14px;z-index:14;background:#d6d6d6;color:#111;border:4px outset #eee;padding:7px 11px;font:700 14px "Courier New";display:none}
.zoomed .back{display:block}
.scan{position:absolute;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 3px,rgba(0,0,0,.11) 4px);mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 90px rgba(0,0,0,.28)}
@media (max-width:600px){
 .titlebar{height:48px;flex-basis:48px}
 .buttons i{width:31px;height:29px}
 .mode{top:14px;right:12px;min-width:135px;font-size:13px;padding:7px 10px}
 .mode b{font-size:18px}
 .status{height:58px;flex-basis:58px;font-size:15px;padding:17px 22px}
}
.hotspot.debug{outline:2px solid rgba(255,0,0,.8);background:rgba(255,0,0,.08)}

/* LIVE CRT SCREEN -------------------------------------------------- */
#crtScreen{
  position:absolute;
  z-index:18;
  left:36.25%;
  top:46.6%;
  width:13.9%;
  height:16.0%;
  background:#04141a;
  color:#8ef9ff;
  overflow:hidden;
  transform:perspective(500px) rotateY(-1.1deg) rotateX(.6deg);
  transform-origin:center center;
  box-shadow:
    inset 0 0 14px rgba(80,220,255,.14),
    0 0 2px rgba(0,0,0,.7);
  border-radius:2px;
  pointer-events:auto;
  image-rendering:pixelated;
}
#crtScreen::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;z-index:5;
  background:
    repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,rgba(0,0,0,.06) 2px 3px),
    radial-gradient(circle at 50% 48%,transparent 58%,rgba(0,0,0,.25) 100%);
}
#crtScreen::after{
  content:"";
  position:absolute;inset:-8%;pointer-events:none;z-index:6;
  background:linear-gradient(90deg,transparent,rgba(150,255,255,.03),transparent);
  animation:crtSweep 5.5s linear infinite;
}
@keyframes crtSweep{
  from{transform:translateX(-35%)}
  to{transform:translateX(35%)}
}
#crtInner{
  position:absolute;inset:0;
  padding:6% 7%;
  font-size:clamp(5px,.75vw,11px);
  line-height:1.25;
  letter-spacing:.02em;
  text-shadow:0 0 3px rgba(115,248,255,.45);
}
#crtInner .prompt{opacity:.9}
#crtInner .blink{animation:blink .8s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
#crtInner button{
  display:block;
  width:100%;
  padding:1px 0;
  border:0;
  background:transparent;
  color:#8ef9ff;
  font:inherit;
  line-height:1.25;
  text-align:left;
  cursor:pointer;
}
#crtInner button:active,
#crtInner button:focus-visible{
  background:rgba(142,249,255,.10);
  outline:none;
}
#crtInner .tiny{font-size:.88em;opacity:.78}

body.computer-view #crtScreen{
  pointer-events:auto;
}

</style>
</head>
<body>
<div class="window">
 <div class="titlebar">▣ Jackiebuckets.party <span class="buttons"><i>_</i><i>□</i><i>×</i></span></div>
 <main class="viewport" id="viewport">
  <div class="scene" id="scene">
   <div class="camera" id="camera">
    <img class="room night" src="room-night.png" alt="">
    <img class="room day" src="room-day.png" alt="">

    <div id="crtScreen" aria-label="Computer screen">
      <div id="crtInner"></div>
    </div>

    <button class="hotspot" id="computer" aria-label="Computer"></button>
    <button class="hotspot" id="music" aria-label="Stereo and records"></button>
    <button class="hotspot" id="photos" aria-label="Photos"></button>
    <button class="hotspot" id="door" aria-label="Door"></button>
    <button class="hotspot" id="guitar" aria-label="Pink guitar"></button>
    <button class="hotspot" id="lamp" aria-label="Hula lamp"></button>
    <button class="hotspot" id="tapestry" aria-label="Orange tapestry"></button>
    <button class="hotspot" id="skull" aria-label="Beaded skull"></button>
    <button class="hotspot" id="records" aria-label="Records and books"></button>
   </div>
   <button class="back" id="back">← BACK</button>
   <div class="mode"><b id="modeText">NIGHT MODE</b><span id="clock"></span></div>
   <div class="hint" id="hint">DRAG TO LOOK · TAP THINGS</div>
   <div class="vignette"></div><div class="scan"></div>
  </div>
 </main>
 <footer class="status" id="status">CLICK AROUND.</footer>
</div>
<script>
const viewport=document.getElementById('viewport'), camera=document.getElementById('camera'),
scene=document.getElementById('scene'), status=document.getElementById('status'),
back=document.getElementById('back'), hint=document.getElementById('hint'),
crtScreen=document.getElementById('crtScreen'), crtInner=document.getElementById('crtInner');

let panX=0, panY=0, dragging=false, moved=false, sx=0, sy=0, startX=0, startY=0, zoomed=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const ROOM_ASPECT=768/455;

function getPanLimit(){
 return Math.max(0,(camera.offsetWidth-viewport.clientWidth)/2);
}
function sizeCamera(){
 const vw=viewport.clientWidth, vh=viewport.clientHeight;
 let h=vh*1.14, w=h*ROOM_ASPECT;
 if(w<vw){ w=vw*1.03; h=w/ROOM_ASPECT; }
 camera.style.width=w+'px';
 camera.style.height=h+'px';
 if(!zoomed){
   const lim=getPanLimit();
   panX=clamp(panX,-lim,lim);
   camera.style.left=`calc(50% + ${panX}px)`;
   camera.style.top=`calc(50% + ${panY}px)`;
   camera.style.transform='translate(-50%,-50%) scale(1.005)';
 }
}
function getVerticalLimit(){
 return Math.max(0,(camera.offsetHeight-viewport.clientHeight)/2)*0.92;
}
function applyPan(){
 if(zoomed)return;
 const lim=getPanLimit();
 const vlim=getVerticalLimit();
 panX=clamp(panX,-lim,lim);
 panY=clamp(panY,-vlim,vlim);
 camera.style.left=`calc(50% + ${panX}px)`;
 camera.style.top=`calc(50% + ${panY}px)`;
 camera.style.transform='translate(-50%,-50%) scale(1.005)';
}
function pointerDown(e){
 if(zoomed||e.target.closest("button"))return;
 dragging=true;moved=false;sx=e.clientX;sy=e.clientY;startX=panX;startY=panY;
 viewport.classList.add('dragging');viewport.setPointerCapture?.(e.pointerId);
}
function pointerMove(e){
 if(!dragging||zoomed)return;
 const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)+Math.abs(dy)>7)moved=true;
 panX=startX+dx*1.08;
 panY=startY+dy*.42;
 applyPan();
}
function pointerUp(e){
 dragging=false;viewport.classList.remove('dragging');
 try{viewport.releasePointerCapture?.(e.pointerId)}catch{}
}
viewport.addEventListener('pointerdown',pointerDown);
viewport.addEventListener('pointermove',pointerMove);
viewport.addEventListener('pointerup',pointerUp);
viewport.addEventListener('pointercancel',pointerUp);
window.addEventListener('resize',sizeCamera);

const views={
 computer:{x:0,y:0,s:1,label:'THE COMPUTER.'}
};

function goView(name){
 const v=views[name]; if(!v)return;
 zoomed=true;scene.classList.add('zoomed');hint.style.opacity='0';
 camera.classList.add('stepped');

 const roomW=camera.offsetWidth, roomH=camera.offsetHeight;
 const baseLeft=viewport.clientWidth/2+panX;
 const baseTop=viewport.clientHeight/2+panY;
 const nodeMap={
  computer:{fx:-.03,fy:.05,s:1.70},
  music:{fx:-.24,fy:.06,s:1.62},
  photos:{fx:.24,fy:.02,s:1.52},
  door:{fx:-.34,fy:.02,s:1.50},
  guitar:{fx:.31,fy:.06,s:1.60}
 };
 const n=nodeMap[name];
 const targetLeft=viewport.clientWidth/2+n.fx*roomW;
 const targetTop=viewport.clientHeight/2+n.fy*roomH;
 const steps=[.34,.68,1];
 let i=0;
 const doStep=(t)=>{
  const left=baseLeft+(targetLeft-baseLeft)*t;
  const top=baseTop+(targetTop-baseTop)*t;
  const sc=1+(n.s-1)*t;
  camera.style.left=left+'px';
  camera.style.top=top+'px';
  camera.style.transform=`translate(-50%,-50%) scale(${sc})`;
 };
 doStep(steps[0]);
 const timer=setInterval(()=>{i++;if(i>=steps.length){clearInterval(timer);return}doStep(steps[i])},85);
 status.textContent=v.label;
}
document.getElementById('computer').addEventListener('click',(e)=>{
 e.stopPropagation();moved=false;
 if(!zoomed) enterComputer();
});moved=false;goView(id)}));


function bootScreen(){
 crtInner.innerHTML=`
 <div>JACKIEBUCKETS BIOS v1.0</div>
 <div class="tiny">640K OK &nbsp; VIDEO OK</div>
 <div class="tiny">MOUSE... FOUND</div>
 <br>
 <div class="prompt">C:\\&gt;<span class="blink">_</span></div>`;
 setTimeout(showDesktop,850);
}

function showDesktop(){
 crtInner.innerHTML=`
 <div class="tiny">JACKIEBUCKETS.PARTY</div>
 <div>----------------</div>
 <button data-crt="internet">&gt; INTERNET</button>
 <button data-crt="photos">&gt; PHOTOS</button>
 <button data-crt="music">&gt; MUSIC</button>
 <button data-crt="journal">&gt; JOURNAL</button>
 <button data-crt="unknown">&gt; ???</button>
 <br>
 <div class="tiny">C:\\ROOM\\&gt;<span class="blink">_</span></div>`;
 wireCrtButtons();
}

function wireCrtButtons(){
 crtInner.querySelectorAll('[data-crt]').forEach(btn=>{
  btn.addEventListener('click',(e)=>{
   e.stopPropagation();
   if(!zoomed){
    enterComputer();
    return;
   }
   const kind=btn.dataset.crt;
   const pages={
    internet:'NO CONNECTION.<br><br><span class="tiny">TRY AGAIN LATER.</span>',
    photos:'PHOTOS.EXE<br><br><span class="tiny">NOTHING LOADED YET.</span>',
    music:'MUSIC.DRV<br><br><span class="tiny">THE TURNTABLE IS OVER THERE.</span>',
    journal:'JOURNAL.TXT<br><br><span class="tiny">NOT EVERYTHING NEEDS TO BE POSTED.</span>',
    unknown:'???<br><br><span class="tiny">YOU SHOULD NOT HAVE OPENED THIS.</span>'
   };
   crtInner.innerHTML=`<button data-backcrt>&lt; BACK</button><br>${pages[kind]}`;
   crtInner.querySelector('[data-backcrt]').addEventListener('click',(ev)=>{
    ev.stopPropagation();showDesktop();
   });
  });
 });
}

function enterComputer(){
 zoomed=true;
 document.body.classList.add('computer-view');
 scene.classList.add('zoomed');
 hint.style.opacity='0';
 status.textContent='THE COMPUTER.';

 const roomW=camera.offsetWidth, roomH=camera.offsetHeight;
 const baseLeft=viewport.clientWidth/2+panX;
 const baseTop=viewport.clientHeight/2+panY;

 // Center the CRT face instead of just scaling toward the whole desk.
 const targetLeft=viewport.clientWidth/2 + roomW*0.105;
 const targetTop=viewport.clientHeight/2 + roomH*0.135;
 const targetScale=2.32;

 camera.classList.add('stepped');
 const steps=[.33,.66,1];
 let i=0;
 const doStep=(t)=>{
  const left=baseLeft+(targetLeft-baseLeft)*t;
  const top=baseTop+(targetTop-baseTop)*t;
  const sc=1+(targetScale-1)*t;
  camera.style.left=left+'px';
  camera.style.top=top+'px';
  camera.style.transform=`translate(-50%,-50%) scale(${sc})`;
 };
 doStep(steps[0]);
 const timer=setInterval(()=>{
  i++;
  if(i>=steps.length){clearInterval(timer);return}
  doStep(steps[i]);
 },82);
}

crtScreen.addEventListener('click',(e)=>{
 if(!zoomed){
  e.stopPropagation();
  moved=false;
  enterComputer();
 }
});

bootScreen();


back.addEventListener('click',(e)=>{
 e.stopPropagation();zoomed=false;scene.classList.remove('zoomed');
 panY=0;camera.classList.add('stepped');sizeCamera();
 status.textContent='CLICK AROUND.';hint.style.opacity='1';
});

let lightMode=null; // null = choose initial state from actual time

function applyLightMode(day){
 scene.classList.toggle('daytime',day);
 document.getElementById('modeText').textContent=day?'DAY MODE':'NIGHT MODE';
}

function toggleLamp(){
 const currentlyDay=scene.classList.contains('daytime');
 lightMode=!currentlyDay;
 applyLightMode(lightMode);
 status.textContent=lightMode?'DAYLIGHT.':'NIGHT AGAIN.';
}

function updateTime(){
 const d=new Date();
 if(lightMode===null){
   const h=d.getHours();
   applyLightMode(h>=7&&h<19);
 }
 document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
updateTime();setInterval(updateTime,30000);

document.getElementById('lamp').addEventListener('click',(e)=>{
 e.stopPropagation();
 moved=false;
 toggleLamp();
});
document.getElementById('tapestry').addEventListener('click',(e)=>{
 e.stopPropagation(); moved=false; status.textContent="IT DOESN'T DO ANYTHING. PROBABLY.";
});
document.getElementById('skull').addEventListener('click',(e)=>{
 e.stopPropagation(); moved=false; status.textContent='HE KNOWS SOMETHING.';
});
document.getElementById('records').addEventListener('click',(e)=>{
 e.stopPropagation(); moved=false; status.textContent='YOU COULD STAY HERE A WHILE.';
});
</script>
</body>
</html>
