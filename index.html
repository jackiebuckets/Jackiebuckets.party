<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jackiebuckets.party</title>
<style>
:root{
  --blue:#0000aa;
  --cyan:#75f6ff;
  --panel:#c0c0c0;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407}
body{font-family:"Courier New",monospace;color:#fff}
#app{position:fixed;inset:0;background:#020407}
#titlebar{
  position:absolute;z-index:50;left:0;right:0;top:0;height:42px;
  background:var(--blue);color:#fff;border:2px solid #eee;
  box-shadow:inset -2px -2px #666,inset 2px 2px #fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5px 0 10px;font-size:19px;font-weight:bold
}
#buttons{display:flex;gap:2px}
.winbtn{
  width:29px;height:27px;background:#c0c0c0;color:#111;
  border:2px solid #eee;box-shadow:inset -2px -2px #777,inset 2px 2px #fff;
  display:grid;place-items:center;font-weight:bold
}
#game{
  position:absolute;z-index:1;left:0;right:0;top:42px;bottom:52px;
  overflow:hidden;background:#07101a;touch-action:none
}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#scan{
  position:absolute;z-index:10;inset:42px 0 52px;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(255,255,255,.012) 0 1px,rgba(0,0,0,.028) 2px 3px),
    radial-gradient(circle at 50% 48%,transparent 52%,rgba(0,0,0,.16) 100%);
  mix-blend-mode:overlay;opacity:.62
}
#statusbar{
  position:absolute;z-index:50;left:0;right:0;bottom:0;min-height:52px;
  background:#000;border-top:1px solid #555;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:8px 18px calc(8px + env(safe-area-inset-bottom));
  gap:12px;font-size:14px;letter-spacing:.045em
}
#status{white-space:nowrap}
#hint{text-align:center;color:#aaa;font-size:12px;white-space:nowrap}
#right{text-align:right;color:#8e8e8e;font-size:11px;white-space:nowrap}
#mode{
  position:absolute;z-index:30;right:14px;top:56px;
  min-width:145px;background:#d9d9d9;color:#111;padding:7px 9px;
  border:2px solid #eee;box-shadow:inset -2px -2px #777,inset 2px 2px #fff;
  font-size:12px;line-height:1.3
}
#mode strong{display:block;font-size:15px}
#reticle{
  position:absolute;z-index:25;left:50%;top:50%;
  width:15px;height:15px;transform:translate(-50%,-50%);
  pointer-events:none;opacity:.48
}
#reticle::before,#reticle::after{content:"";position:absolute;background:var(--cyan)}
#reticle::before{left:7px;top:0;width:1px;height:15px}
#reticle::after{left:0;top:7px;width:15px;height:1px}

#dialog{
  position:absolute;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 28px));
  background:#c0c0c0;color:#000;border:2px solid #fff;
  box-shadow:inset -2px -2px #707070,inset 2px 2px #dfdfdf,8px 8px 0 rgba(0,0,0,.45)
}
#dialog[hidden]{display:none}
.dialog-title{
  background:#0000aa;color:#fff;font-weight:bold;padding:4px 5px 4px 7px;
  display:flex;justify-content:space-between;align-items:center
}
.dialog-title button{
  width:27px;height:24px;background:#c0c0c0;border:2px solid #fff;
  box-shadow:inset -2px -2px #777,inset 2px 2px #eee
}
.dialog-body{padding:14px}
.terminal{
  background:#061015;color:var(--cyan);border:3px inset #aaa;
  padding:14px;min-height:235px;line-height:1.55
}
.terminal button{
  display:block;width:100%;padding:5px 0;background:transparent;border:0;
  color:var(--cyan);font:inherit;text-align:left;cursor:pointer
}
.terminal button:focus-visible{outline:1px dashed var(--cyan)}

@media(max-width:700px){
  #titlebar{height:40px;font-size:16px}
  #game{top:40px;bottom:58px}
  #scan{inset:40px 0 58px}
  #statusbar{min-height:58px;grid-template-columns:1fr;padding:9px 14px calc(9px + env(safe-area-inset-bottom));font-size:13px}
  #hint,#right{display:none}
  #mode{right:8px;top:51px;min-width:130px}
}
</style>
</head>
<body class="night">
<div id="app">
  <div id="titlebar">
    <span>Jackiebuckets.party</span>
    <div id="buttons"><span class="winbtn">_</span><span class="winbtn">□</span><span class="winbtn">×</span></div>
  </div>

  <div id="game"></div>
  <div id="scan"></div>
  <div id="reticle"></div>

  <div id="mode"><strong id="modeLabel">NIGHT MODE</strong><span id="clock">--:-- --</span></div>

  <div id="statusbar" aria-live="polite">
    <span id="status">CLICK AROUND.</span>
    <span id="hint">DRAG TO LOOK · TAP OBJECTS</span>
    <span id="right">SOME THINGS WORK. SOME THINGS DON'T.</span>
  </div>

  <section id="dialog" hidden role="dialog" aria-modal="true">
    <div class="dialog-title">
      <span id="dialogTitle">C:\JACKIEBUCKETS</span>
      <button id="closeDialog" type="button">×</button>
    </div>
    <div class="dialog-body">
      <div id="terminal" class="terminal">
        JACKIEBUCKETS.PARTY<br>
        -------------------<br><br>
        <button type="button" data-page="internet">&gt; INTERNET</button>
        <button type="button" data-page="photos">&gt; PHOTOS</button>
        <button type="button" data-page="music">&gt; MUSIC</button>
        <button type="button" data-page="journal">&gt; JOURNAL</button>
        <button type="button" data-page="unknown">&gt; ???</button>
      </div>
    </div>
  </section>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const game = document.getElementById("game");
const statusEl = document.getElementById("status");
const modeLabel = document.getElementById("modeLabel");
const clockEl = document.getElementById("clock");
const dialog = document.getElementById("dialog");
const dialogTitle = document.getElementById("dialogTitle");
const terminal = document.getElementById("terminal");

const renderer = new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.outputColorSpace = THREE.SRGBColorSpace;
game.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06101a);

const camera = new THREE.PerspectiveCamera(50,1,0.1,30);
camera.position.set(0,0,0);

const ROOM_W = 1536;
const ROOM_H = 910;
const ASPECT = ROOM_W / ROOM_H;
const BASE_DISTANCE = 5.0;
const WORLD_H = 5.0;
const WORLD_W = WORLD_H * ASPECT;

// ---------------------------------------------------------
// Depth-painted mesh.
// At the default viewpoint every vertex projects back onto
// the exact same pixel it came from, so the locked artwork
// remains visually unchanged. Moving the camera reveals depth.
// ---------------------------------------------------------
const COLS = 128;
const ROWS = 76;
const geometry = new THREE.PlaneGeometry(WORLD_W,WORLD_H,COLS,ROWS);
const pos = geometry.attributes.position;

function smoothstep(a,b,x){
  const t=Math.max(0,Math.min(1,(x-a)/(b-a)));
  return t*t*(3-2*t);
}
function ellipse(u,v,cx,cy,rx,ry){
  const q=Math.sqrt(((u-cx)/rx)**2 + ((v-cy)/ry)**2);
  return 1-smoothstep(.55,1.0,q);
}
function rectSoft(u,v,x1,y1,x2,y2,feather=.06){
  const ix=smoothstep(x1-feather,x1+feather,u)*(1-smoothstep(x2-feather,x2+feather,u));
  const iy=smoothstep(y1-feather,y1+feather,v)*(1-smoothstep(y2-feather,y2+feather,v));
  return ix*iy;
}
function depthAt(u,v){
  let d=0;

  // Floor comes progressively toward the viewer.
  const floor = smoothstep(.61,1.0,v);
  d = Math.max(d, floor*0.60);

  // Bed / plant mass in the near-left foreground.
  d = Math.max(d, ellipse(u,v,.11,.80,.23,.30)*1.20);

  // Office chair.
  d = Math.max(d, ellipse(u,v,.29,.72,.16,.27)*1.00);

  // Coffee table / books foreground.
  d = Math.max(d, ellipse(u,v,.68,.91,.20,.16)*1.12);

  // Right foreground chair.
  d = Math.max(d, ellipse(u,v,.95,.82,.18,.29)*1.15);

  // Desk/CRT/stereo live in the middle distance.
  d = Math.max(d, rectSoft(u,v,.21,.44,.76,.79,.055)*0.36);

  // Lamp / guitar are slightly in front of the desk/wall.
  d = Math.max(d, ellipse(u,v,.255,.53,.065,.17)*0.54);
  d = Math.max(d, ellipse(u,v,.145,.57,.055,.18)*0.42);

  // Shelf foliage gives a little depth against the wall.
  d = Math.max(d, ellipse(u,v,.35,.37,.12,.18)*0.26);

  return d;
}

// Compensate x/y for each displaced depth so the default
// camera still reproduces the original 2D image exactly.
for(let i=0;i<pos.count;i++){
  const x0=pos.getX(i);
  const y0=pos.getY(i);
  const u=x0/WORLD_W + .5;
  const v=.5 - y0/WORLD_H;
  const offset=depthAt(u,v);
  const dist=BASE_DISTANCE-offset;
  const scale=dist/BASE_DISTANCE;
  pos.setXYZ(i,x0*scale,y0*scale,-dist);
}
geometry.computeVertexNormals();

const texture = new THREE.TextureLoader().load("room.png");
texture.colorSpace = THREE.SRGBColorSpace;
texture.minFilter = THREE.NearestFilter;
texture.magFilter = THREE.NearestFilter;

const roomMat = new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide});
const roomMesh = new THREE.Mesh(geometry,roomMat);
scene.add(roomMesh);

// Invisible click targets exist in the same perspective space.
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(0,0);
const targets=[];

function worldFromUV(u,v,depth=0.25){
  const x0=(u-.5)*WORLD_W;
  const y0=(.5-v)*WORLD_H;
  const dist=BASE_DISTANCE-depth;
  const s=dist/BASE_DISTANCE;
  return new THREE.Vector3(x0*s,y0*s,-dist);
}
function hotspot(id,label,u,v,w,h,depth=.28){
  const center=worldFromUV(u,v,depth);
  const dist=BASE_DISTANCE-depth;
  const s=dist/BASE_DISTANCE;
  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(WORLD_W*w*s,WORLD_H*h*s),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})
  );
  mesh.position.copy(center);
  mesh.userData={id,label};
  scene.add(mesh);targets.push(mesh);
}
hotspot("lamp","THE HULA LAMP.",.255,.52,.085,.21,.50);
hotspot("computer","THE COMPUTER.",.405,.53,.15,.20,.36);
hotspot("stereo","IT STILL WORKS.",.655,.58,.18,.18,.35);
hotspot("photos","YOU REMEMBER THIS DIFFERENTLY.",.34,.23,.20,.35,.08);
hotspot("tapestry","YOU'VE LOOKED AT THIS A LOT.",.565,.27,.22,.48,.05);
hotspot("skull","LITTLE BEADED GUY.",.71,.20,.09,.25,.05);
hotspot("door","A CLOSED DOOR.",.82,.48,.16,.62,.03);
hotspot("guitar","THE PINK STRAT.",.155,.57,.07,.27,.40);
hotspot("records","RECORDS. BOOKS. HUMAN DESTINY.",.655,.74,.20,.20,.30);

// Camera / look controls.
let currentX=0,currentY=0,targetX=0,targetY=0;
let dragging=false,startX=0,startY=0,startTX=0,startTY=0,moved=0;
let focus = null;
let focusZoom = 1;

function limits(){
  const portrait=game.clientWidth/game.clientHeight < .85;
  return portrait ? {x:1.05,y:.16} : {x:.24,y:.09};
}
renderer.domElement.addEventListener("pointerdown",e=>{
  dragging=true;
  startX=e.clientX; startY=e.clientY;
  startTX=targetX; startTY=targetY;
  moved=0;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;

  if(dragging){
    const dx=e.clientX-startX,dy=e.clientY-startY;
    moved=Math.max(moved,Math.hypot(dx,dy));
    const lim=limits();
    targetX=THREE.MathUtils.clamp(startTX-dx/(game.clientWidth*.55),-1,1)*lim.x;
    targetY=THREE.MathUtils.clamp(startTY+dy/(game.clientHeight*1.6),-1,1)*lim.y;
  }
});
renderer.domElement.addEventListener("pointerup",e=>{
  dragging=false;
  try{renderer.domElement.releasePointerCapture(e.pointerId)}catch{}
  if(moved<8) interact();
});

function say(t){statusEl.textContent=t}

let mode="night";
function setMode(next){
  mode=next;
  if(mode==="night"){
    renderer.domElement.style.filter="brightness(1) saturate(1)";
    scene.background.set(0x06101a);
    modeLabel.textContent="NIGHT MODE";
    say("NIGHT AGAIN.");
  }else{
    renderer.domElement.style.filter="brightness(1.32) saturate(.88) sepia(.10)";
    scene.background.set(0xaab7bb);
    modeLabel.textContent="DAY MODE";
    say("DAYLIGHT.");
  }
}
function toggleMode(){setMode(mode==="night"?"day":"night")}
setMode("night");

function openComputer(){
  dialogTitle.textContent="C:\\JACKIEBUCKETS";
  terminal.innerHTML=`
    JACKIEBUCKETS.PARTY<br>
    -------------------<br><br>
    <button type="button" data-page="internet">&gt; INTERNET</button>
    <button type="button" data-page="photos">&gt; PHOTOS</button>
    <button type="button" data-page="music">&gt; MUSIC</button>
    <button type="button" data-page="journal">&gt; JOURNAL</button>
    <button type="button" data-page="unknown">&gt; ???</button>`;
  wireTerminal();
  dialog.hidden=false;
}
function showPage(kind){
  const pages={
    internet:["INTERNET","LINKS WILL LIVE HERE.<br><br>THE INTERNET USED TO BE WEIRDER."],
    photos:["PHOTOS","PHOTO ALBUM COMING SOON.<br><br>YOU REMEMBER THIS DIFFERENTLY."],
    music:["MUSIC","THE TURNTABLE STILL WORKS."],
    journal:["JOURNAL","NOT EVERYTHING NEEDS TO BE POSTED."],
    unknown:["???","YOU FOUND SOMETHING THAT DOESN'T EXIST YET."]
  };
  const [title,body]=pages[kind];
  dialogTitle.textContent=title;
  terminal.innerHTML=body;
}
function wireTerminal(){
  terminal.querySelectorAll("[data-page]").forEach(b=>{
    b.addEventListener("click",()=>showPage(b.dataset.page));
  });
}
function interact(){
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObjects(targets,false)[0];
  if(!hit){say("CLICK AROUND.");return}
  const id=hit.object.userData.id;
  if(id==="lamp"){toggleMode();return}
  if(id==="computer"){say("BOOTING...");openComputer();return}
  if(id==="stereo"){say("IT STILL WORKS.");return}
  if(id==="photos"){say("YOU REMEMBER THIS DIFFERENTLY.");return}
  if(id==="tapestry"){say("IT DOESN'T DO ANYTHING. PROBABLY.");return}
  if(id==="skull"){say("HE KNOWS SOMETHING.");return}
  if(id==="door"){say("NOT YET.");return}
  if(id==="guitar"){say("DON'T DROP IT.");return}
  if(id==="records"){say("YOU COULD STAY HERE A WHILE.");return}
}
document.getElementById("closeDialog").addEventListener("click",()=>{
  dialog.hidden=true;say("CLICK AROUND.");
});
wireTerminal();

function resize(){
  const w=game.clientWidth,h=game.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;

  // Fit the locked artwork naturally:
  // portrait fills height and crops sides; landscape nearly shows it all.
  if(camera.aspect >= ASPECT){
    const visibleH = WORLD_W / camera.aspect;
    camera.fov = THREE.MathUtils.radToDeg(2*Math.atan((visibleH/2)/BASE_DISTANCE))*1.035;
  }else{
    camera.fov = THREE.MathUtils.radToDeg(2*Math.atan((WORLD_H/2)/BASE_DISTANCE))*1.025;
  }
  camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);
resize();

function updateClock(){
  clockEl.textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
updateClock();
setInterval(updateClock,30000);

let hoverId=null;
function animate(){
  currentX += (targetX-currentX)*.075;
  currentY += (targetY-currentY)*.075;

  camera.position.x=currentX;
  camera.position.y=currentY;
  camera.position.z=0;

  // Keep the view parallel to the art plane. The different vertex depths
  // create the parallax instead of rotating a flat photo.
  camera.rotation.set(0,0,0);

  if(!dragging && dialog.hidden){
    raycaster.setFromCamera(pointer,camera);
    const hit=raycaster.intersectObjects(targets,false)[0];
    const id=hit?.object?.userData?.id || null;
    if(id!==hoverId){
      hoverId=id;
      say(hit ? hit.object.userData.label : "CLICK AROUND.");
    }
  }

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
