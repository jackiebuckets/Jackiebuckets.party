<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jackiebuckets.party</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#eee;font-family:"Courier New",monospace;touch-action:none}
.window{position:relative;width:100%;height:100dvh;overflow:hidden;background:#05070b}
.titlebar{position:absolute;z-index:100;left:0;right:0;top:0;height:48px;background:#0700b8;border:4px ridge #ddd;display:flex;align-items:center;padding:0 10px;font-weight:bold;font-size:clamp(18px,4vw,27px);letter-spacing:.5px;pointer-events:none}
.buttons{margin-left:auto;display:flex;gap:3px}.buttons i{width:34px;height:30px;background:#d8d8d8;border:4px outset #eee;color:#111;display:grid;place-items:center;font-style:normal;font-family:Arial;font-size:18px}
.viewport{position:absolute!important;z-index:1;left:0!important;right:0!important;top:0!important;bottom:0!important;width:100%!important;height:100%!important;overflow:hidden;background:#060b13;touch-action:none;overscroll-behavior:none;cursor:grab}
.viewport.dragging{cursor:grabbing}
.scene{position:absolute;inset:0;overflow:hidden}
.camera{
 position:absolute;left:50%;top:50%;
 width:1000px;height:593px;
 transform:translate(-50%,-50%);
 transform-origin:50% 50%;
 will-change:left,top,transform;
 transition:left .18s steps(3,end),top .18s steps(3,end),transform .34s steps(6,end)
}
.camera.stepped{transition:none}
.room{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:fill;user-select:none;-webkit-user-drag:none;
 image-rendering:pixelated;transition:opacity .35s ease
}
.room.day{opacity:0}.daytime .room.day{opacity:1}.daytime .room.night{opacity:0}
.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:2px dashed #fff}

#lamp{left:22.8%;top:43.0%;width:8.3%;height:22.5%}
#computer{left:34.3%;top:42.0%;width:16.5%;height:24.5%}
#music{left:59.0%;top:49.5%;width:17.8%;height:21.5%}
#photos{left:24.0%;top:8.5%;width:21.5%;height:34.5%}
#door{left:76.7%;top:10.0%;width:17.5%;height:60.0%}
#guitar{left:11.0%;top:43.5%;width:8.5%;height:31.5%}
#tapestry{left:46.0%;top:6.0%;width:21.0%;height:48.0%}
#skull{left:67.0%;top:7.5%;width:8.5%;height:27.0%}
#records{left:57.0%;top:64.0%;width:20.0%;height:24.0%}
.mode{position:absolute;right:16px;top:62px;background:#d6d6d6;color:#171717;border:5px ridge #eee;padding:8px 14px;z-index:12;min-width:150px;box-shadow:2px 2px #111;font-size:15px;pointer-events:none}
.mode b{display:block;font-size:20px}.mode span{display:block;margin-top:4px}
.hint{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:12;background:rgba(5,5,5,.75);border:2px solid #777;padding:8px 13px;white-space:nowrap;font-size:13px;pointer-events:none;transition:opacity .3s}
.status{position:absolute;z-index:100;left:0;right:0;bottom:0;height:58px;background:#020202;border-top:2px solid #555;padding:17px 22px;font-size:15px;letter-spacing:2px;pointer-events:none}
.back{position:absolute;left:14px;top:14px;z-index:14;background:#d6d6d6;color:#111;border:4px outset #eee;padding:7px 11px;font:700 14px "Courier New";display:none}
.zoomed .back{display:block}
.scan{position:absolute;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 3px,rgba(0,0,0,.11) 4px);mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 90px rgba(0,0,0,.28)}
@media (max-width:600px){
 .titlebar{height:48px}
 .buttons i{width:31px;height:29px}
 .mode{top:14px;right:12px;min-width:135px;font-size:13px;padding:7px 10px}
 .mode b{font-size:18px}
 .status{height:58px;font-size:15px;padding:17px 22px}
}
.hotspot.debug{outline:2px solid rgba(255,0,0,.8);background:rgba(255,0,0,.08)}



/* V10 — actual CRT interaction window */
.crt-window{
  position:absolute; z-index:40; display:none;
  left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(430px,88vw);
  background:#c0c0c0; color:#000;
  border:4px outset #eee;
  box-shadow:8px 10px 0 rgba(0,0,0,.45);
  font-family:"Courier New",monospace;
}
.crt-window.open{display:block}
.crt-titlebar{
  height:34px; display:flex; align-items:center;
  padding:3px 5px 3px 8px;
  background:#0700b8; color:#fff; font-weight:bold;
}
.crt-close{
  margin-left:auto; width:28px; height:25px;
  border:3px outset #eee; background:#c0c0c0; color:#111;
  font:bold 17px Arial; line-height:17px;
}
.crt-screen{
  margin:8px; padding:16px 18px; min-height:245px;
  background:#041a20; color:#a5ffe9;
  border:4px inset #ddd;
  text-shadow:0 0 4px #65e8d0;
  line-height:1.65;
  box-shadow:inset 0 0 35px #000;
}
.crt-screen button{
  display:block; width:100%; padding:3px 0;
  border:0; background:transparent; color:inherit;
  text-align:left; font:inherit;
}
.crt-screen button:active{background:#a5ffe9;color:#041a20}
.crt-help{opacity:.72;margin-top:12px;font-size:12px}


/* V13 small computer confirmation */
.use-computer{
 position:absolute; z-index:45; display:none;
 left:50%; top:50%; transform:translate(-50%,-50%);
 width:210px; background:#c0c0c0; color:#111;
 border:4px outset #eee; padding:14px 14px 12px;
 font:700 17px "Courier New",monospace;
 box-shadow:6px 7px 0 #0008;
 text-align:center;
}
.use-computer.open{display:block}
.use-computer .choices{display:flex;gap:10px;justify-content:center;margin-top:14px}
.use-computer button{
 min-width:70px;padding:5px 10px;background:#c0c0c0;color:#111;
 border:3px outset #eee;font:700 15px "Courier New",monospace;
}
.use-computer button:active{border-style:inset}


/* V17 input model: one uninterrupted room surface */
.viewport{
  touch-action:none !important;
  overscroll-behavior:none !important;
  user-select:none !important;
  -webkit-user-select:none !important;
}
.hotspot{pointer-events:none !important;}
</style>
</head>
<body>
<div class="window">
 <div class="titlebar">▣ Jackiebuckets.party <span class="buttons"><i>_</i><i>□</i><i>×</i></span></div>
 <main class="viewport" id="viewport">
  <div class="scene" id="scene">
   <div class="camera stepped" id="camera">
    <img class="room night" src="room-night.png" alt="">
    <img class="room day" src="room-day.png" alt="">
    <button class="hotspot" id="computer" aria-label="Computer"></button>
    <button class="hotspot" id="music" aria-label="Stereo and records"></button>
    <button class="hotspot" id="photos" aria-label="Photos"></button>
    <button class="hotspot" id="door" aria-label="Door"></button>
    <button class="hotspot" id="guitar" aria-label="Pink guitar"></button>
    <button class="hotspot" id="lamp" aria-label="Hula lamp"></button>
    <button class="hotspot" id="tapestry" aria-label="Orange tapestry"></button>
    <button class="hotspot" id="skull" aria-label="Beaded skull"></button>
    <button class="hotspot" id="records" aria-label="Records and books"></button>
   </div>
   <button class="back" id="back">← BACK</button>
   <div class="mode"><b id="modeText">NIGHT MODE</b><span id="clock"></span></div>
   <div class="hint" id="hint">DRAG TO LOOK · TAP THINGS</div>

   
   <div class="use-computer" id="useComputer">
     <div>USE COMPUTER?</div>
     <div class="choices">
       <button id="computerYes">YES</button>
       <button id="computerNo">NO</button>
     </div>
   </div>

   <section class="crt-window" id="crtWindow" aria-label="Computer">
    <div class="crt-titlebar">JACKIEBUCKETS.EXE <button class="crt-close" id="crtClose" aria-label="Close">×</button></div>
    <div class="crt-screen">
      JACKIEBUCKETS.PARTY<br><br>
      <button data-crt="internet">&gt; INTERNET</button>
      <button data-crt="photos">&gt; PHOTOS</button>
      <button data-crt="music">&gt; MUSIC</button>
      <button data-crt="journal">&gt; JOURNAL</button>
      <button data-crt="unknown">&gt; ???</button>
      <div class="crt-help">C:\&gt; CLICK SOMETHING_</div>
    </div>
   </section>

   <div class="vignette"></div><div class="scan"></div>
  </div>
 </main>
 <footer class="status" id="status">CLICK AROUND.</footer>
</div>
<script>
const viewport=document.getElementById('viewport'), camera=document.getElementById('camera'),
scene=document.getElementById('scene'), status=document.getElementById('status'),
back=document.getElementById('back'), hint=document.getElementById('hint');

let panX=0, panY=0, dragging=false, moved=false, sx=0, sy=0, startX=0, startY=0, zoomed=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const ROOM_ASPECT=768/455;

function getPanLimit(){
 return Math.max(0,(camera.offsetWidth-viewport.clientWidth)/2);
}
function sizeCamera(){
 const vw=viewport.clientWidth, vh=viewport.clientHeight;

 // V26: treat the 768x455 artwork as a finite room and use the smallest
 // possible COVER scale. The image always reaches every viewport edge,
 // but we never over-zoom it just to manufacture extra panning space.
 // Result: maximum amount of the original room is visible on every screen,
 // with panning only on the axis where the real artwork extends off-screen.
 const coverScale=Math.max(vw/768, vh/455);
 const w=Math.ceil(768*coverScale);
 const h=Math.ceil(455*coverScale);
 camera.style.width=w+'px';
 camera.style.height=h+'px';

 if(!zoomed){
   const lim=getPanLimit();
   const vlim=getVerticalLimit();
   panX=clamp(panX,-lim,lim);
   panY=clamp(panY,-vlim,vlim);
   camera.style.left=`calc(50% + ${panX}px)`;
   camera.style.top=`calc(50% + ${panY}px)`;
   camera.style.transform='translate(-50%,-50%) scale(1.005)';
 }
}
function getVerticalLimit(){
 return Math.max(0,(camera.offsetHeight-viewport.clientHeight)/2);
}
function applyPan(){
 if(zoomed)return;
 const lim=getPanLimit();
 const vlim=getVerticalLimit();
 panX=clamp(panX,-lim,lim);
 panY=clamp(panY,-vlim,vlim);
 camera.style.left=`calc(50% + ${panX}px)`;
 camera.style.top=`calc(50% + ${panY}px)`;
 camera.style.transform='translate(-50%,-50%) scale(1.005)';
}
function pointerDown(e){
 if(zoomed || e.target.closest(".crt-window,.use-computer")) return;
 dragging=true; moved=false;
 sx=e.clientX; sy=e.clientY;
 startX=e.clientX; startY=e.clientY;
 roomWindow.setPointerCapture?.(e.pointerId);
 e.preventDefault();
}
function pointerMove(e){
 if(!dragging||zoomed)return;
 const dx=e.clientX-sx, dy=e.clientY-sy;
 sx=e.clientX; sy=e.clientY;
 if(Math.hypot(e.clientX-startX,e.clientY-startY)>8)moved=true;
 panX += dx*1.08;
 panY += dy*.72;
 applyPan();
 e.preventDefault();
}
function roomObjectAt(clientX,clientY){
 const r=camera.getBoundingClientRect();
 const x=(clientX-r.left)/r.width*100;
 const y=(clientY-r.top)/r.height*100;
 const zones=[
  ['computer',34.3,42.0,16.5,24.5],
  ['lamp',22.8,43.0,8.3,22.5],
  ['music',59.0,49.5,17.8,21.5],
  ['photos',24.0,8.5,21.5,34.5],
  ['door',76.7,10.0,17.5,60.0],
  ['guitar',11.0,43.5,8.5,31.5],
  ['tapestry',46.0,6.0,21.0,48.0],
  ['skull',67.0,7.5,8.5,27.0],
  ['records',57.0,64.0,20.0,24.0]
 ];
 return zones.find(z=>x>=z[1]&&x<=z[1]+z[3]&&y>=z[2]&&y<=z[2]+z[4])?.[0]||null;
}
function pointerUp(e){
 if(!dragging)return;
 dragging=false;
 try{roomWindow.releasePointerCapture?.(e.pointerId)}catch{}
 if(!moved && !zoomed){
   const id=roomObjectAt(e.clientX,e.clientY);
   if(id) document.getElementById(id)?.click();
 }
 e.preventDefault();
}
const roomWindow=document.querySelector('.window');
roomWindow.addEventListener('pointerdown',pointerDown,{passive:false});
roomWindow.addEventListener('pointermove',pointerMove,{passive:false});
roomWindow.addEventListener('pointerup',pointerUp,{passive:false});
roomWindow.addEventListener('pointercancel',pointerUp,{passive:false});
window.addEventListener('resize',sizeCamera);

const views={
 computer:{x:10,y:5,s:1.70,label:'THE COMPUTER.'}
};

const computerZoom={fx:.127,fy:-.072,s:1.70};
const zoomDuration=340;
let zoomAnim=0;
let zoomBase=null;

function easeZoom(t){
 return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
}

function computerFrame(t){
 const roomW=camera.offsetWidth, roomH=camera.offsetHeight;
 const baseLeft=zoomBase.left;
 const baseTop=zoomBase.top;
 const targetLeft=viewport.clientWidth/2+computerZoom.fx*roomW;
 const targetTop=viewport.clientHeight/2+computerZoom.fy*roomH;
 camera.style.left=(baseLeft+(targetLeft-baseLeft)*t)+'px';
 camera.style.top=(baseTop+(targetTop-baseTop)*t)+'px';
 camera.style.transform=`translate(-50%,-50%) scale(${1+(computerZoom.s-1)*t})`;
}

function animateComputerZoom(from,to,done){
 cancelAnimationFrame(zoomAnim);
 const started=performance.now();
 const visualFrames=12; // subtle PilotRedSun-ish loaded-frame cadence
 camera.classList.add('stepped');

 const tick=(now)=>{
   const raw=Math.min(1,(now-started)/zoomDuration);
   const eased=easeZoom(raw);

   // Quantize the animation slightly. This keeps the movement intentional and
   // "rendered in little chunks" without looking like actual performance lag.
   const stepped=Math.round(eased*visualFrames)/visualFrames;

   computerFrame(from+(to-from)*stepped);

   if(raw<1) zoomAnim=requestAnimationFrame(tick);
   else{
     computerFrame(to);
     if(done) done();
   }
 };
 zoomAnim=requestAnimationFrame(tick);
}

function goView(name){
 if(name!=='computer')return;
 zoomed=true;
 scene.classList.add('zoomed');
 hint.style.opacity='0';
 zoomBase={left:viewport.clientWidth/2+panX,top:viewport.clientHeight/2+panY};
 animateComputerZoom(0,1);
 status.textContent='THE COMPUTER.';
}

function exitComputer(){
 document.getElementById('useComputer')?.classList.remove('open');
 document.getElementById('crtWindow')?.classList.remove('open');
 if(!zoomBase) zoomBase={left:viewport.clientWidth/2+panX,top:viewport.clientHeight/2+panY};
 animateComputerZoom(1,0,()=>{
   zoomed=false;
   scene.classList.remove('zoomed');
   hint.style.opacity='1';
   camera.style.left=(viewport.clientWidth/2+panX)+'px';
   camera.style.top=(viewport.clientHeight/2+panY)+'px';
   camera.style.transform='translate(-50%,-50%) scale(1.005)';
   status.textContent='CLICK AROUND.';
   zoomBase=null;
 });
}

document.getElementById('computer').addEventListener('click',(e)=>{
 e.stopPropagation();
 moved=false;
 goView('computer');
 requestAnimationFrame(()=>{
   document.getElementById('useComputer').classList.add('open');
   status.textContent='THE COMPUTER.';
 });
});




let lightMode=null; // null = choose initial state from actual time

function applyLightMode(day){
 scene.classList.toggle('daytime',day);
 document.getElementById('modeText').textContent=day?'DAY MODE':'NIGHT MODE';
}

function toggleLamp(){
 const currentlyDay=scene.classList.contains('daytime');
 lightMode=!currentlyDay;
 applyLightMode(lightMode);
 status.textContent=lightMode?'DAYLIGHT.':'NIGHT AGAIN.';
}


function updateTime(){
 const d=new Date();
 if(lightMode===null){
   const h=d.getHours();
   applyLightMode(h>=7&&h<19);
 }
 document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
updateTime();

setInterval(updateTime,30000);

document.getElementById('lamp').addEventListener('click',(e)=>{
 e.stopPropagation();
 moved=false;
 toggleLamp();
});
document.getElementById('tapestry').addEventListener('click',(e)=>{
 e.stopPropagation(); moved=false; status.textContent="IT DOESN'T DO ANYTHING. PROBABLY.";
});
document.getElementById('skull').addEventListener('click',(e)=>{
 e.stopPropagation(); moved=false; status.textContent='HE KNOWS SOMETHING.';
});
document.getElementById('records').addEventListener('click',(e)=>{
 e.stopPropagation(); moved=false; status.textContent='YOU COULD STAY HERE A WHILE.';
});

const crtWindow=document.getElementById('crtWindow');
document.getElementById('crtClose').addEventListener('click',(e)=>{ e.stopPropagation(); exitComputer(); });
crtWindow.addEventListener('pointerdown',e=>e.stopPropagation());
crtWindow.addEventListener('click',e=>e.stopPropagation());
crtWindow.querySelectorAll('[data-crt]').forEach(btn=>btn.addEventListener('click',()=>{
 const item=btn.dataset.crt;
 const messages={
  internet:'THE INTERNET. A TERRIBLE IDEA.',
  photos:'PHOTOS. COMING SOON.',
  music:'MUSIC. COMING SOON.',
  journal:'JOURNAL. COMING SOON.',
  unknown:'ACCESS DENIED.'
 };
 status.textContent=messages[item];
}));



const useComputer=document.getElementById('useComputer');
useComputer.addEventListener('pointerdown',e=>e.stopPropagation());
useComputer.addEventListener('click',e=>e.stopPropagation());

document.getElementById('computerYes').addEventListener('click',(e)=>{
 e.stopPropagation();
 useComputer.classList.remove('open');
 crtWindow.classList.add('open');
 status.textContent='THE COMPUTER IS AWAKE.';
});

document.getElementById('computerNo').addEventListener('click',(e)=>{ e.stopPropagation(); exitComputer(); });

/* Back also dismisses the small prompt. */


</script>







<script>
(function(){
  function initializeRoomCamera(){
    sizeCamera();
    applyPan();
  }

  /* Initial sizing — this was missing in V21. */
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initializeRoomCamera, {once:true});
  } else {
    initializeRoomCamera();
  }

  /* Run again after the browser settles its mobile viewport height. */
  requestAnimationFrame(()=>requestAnimationFrame(initializeRoomCamera));
  window.addEventListener('load', initializeRoomCamera);

  /* Mobile browser chrome can change the visual viewport without a normal resize. */
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', initializeRoomCamera);
  }
})();
</script>

</body>
